<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sjakkur</title>
<style>
  :root {
    --bg: #111;
    --idle: #2b2b2b;
    --idle-text: #9a9a9a;
    --active: #f2f2f2;
    --active-text: #111;
    --flag: #c62828;
    --bar: #000;
    --accent: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Spillerfeltene – hele halvdelen av skjermen er trykkflate */
  .side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--idle);
    color: var(--idle-text);
    border: none;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #p0 { transform: rotate(180deg); }   /* motstanderen sitter på andre siden */
  .side.active { background: var(--active); color: var(--active-text); }
  .side.flag   { background: var(--flag);   color: #fff; }
  .time {
    font-size: clamp(4rem, 24vw, 12rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    pointer-events: none;
  }
  .moves {
    position: absolute;
    bottom: 1rem;
    font-size: 1rem;
    opacity: .6;
    pointer-events: none;
  }

  /* Midtlinje med kontroller */
  .bar {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    padding: .4rem;
    background: var(--bar);
  }
  .bar button {
    width: 64px;
    height: 52px;
    font-size: 1.6rem;
    background: #222;
    color: #eee;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .bar button:active { background: #444; }

  /* Liggende skjerm: side ved side */
  @media (orientation: landscape) {
    #app { flex-direction: row; }
    #p0 { transform: none; }
    .bar { flex-direction: column; padding: .4rem; }
    .time { font-size: clamp(3rem, 12vw, 10rem); }
  }

  /* Innstillinger */
  #settings {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 10;
  }
  #settings.hidden { display: none; }
  .panel {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
  }
  .panel h2 { font-size: 1.2rem; margin-bottom: .8rem; font-weight: 600; }
  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .6rem;
    margin-bottom: 1.4rem;
  }
  .presets button, .panel .big {
    min-height: 64px;
    font-size: 1.3rem;
    font-weight: 600;
    background: #2b2b2b;
    color: #eee;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .presets button:active, .panel .big:active { background: #444; }
  .custom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .6rem;
    margin-bottom: .8rem;
  }
  .custom label { font-size: .9rem; opacity: .8; display: flex; flex-direction: column; gap: .3rem; }
  .custom input {
    font-size: 1.4rem;
    padding: .6rem;
    border-radius: 10px;
    border: 1px solid #444;
    background: #1b1b1b;
    color: #fff;
    width: 100%;
  }
  .panel .big { width: 100%; margin-top: .4rem; }
  .panel .start { background: var(--accent); color: #fff; }
  .panel .close { background: transparent; border: 1px solid #444; }
  .hint { font-size: .85rem; opacity: .6; margin-top: 1rem; line-height: 1.4; }
</style>
</head>
<body>
<div id="app">
  <button class="side" id="p0" aria-label="Spiller 1"><span class="time">5:00</span><span class="moves"></span></button>
  <div class="bar">
    <button id="pauseBtn" aria-label="Pause">⏸</button>
    <button id="resetBtn" aria-label="Nullstill">↺</button>
    <button id="settingsBtn" aria-label="Innstillinger">⚙</button>
  </div>
  <button class="side" id="p1" aria-label="Spiller 2"><span class="time">5:00</span><span class="moves"></span></button>
</div>

<div id="settings">
  <div class="panel">
    <h2>Velg tid (minutter + sekunder per trekk)</h2>
    <div class="presets" id="presets"></div>

    <h2>Egendefinert</h2>
    <div class="custom">
      <label>Minutter
        <input id="minInput" type="number" inputmode="decimal" min="0.5" step="0.5" value="5">
      </label>
      <label>Tillegg (sek)
        <input id="incInput" type="number" inputmode="numeric" min="0" step="1" value="0">
      </label>
    </div>
    <button class="big start" id="startBtn">Start</button>
    <button class="big close" id="closeBtn">Lukk</button>
    <p class="hint">Den som ikke starter trykker på sin side for å starte motstanderens klokke. Trykk på din egen side etter hvert trekk.</p>
  </div>
</div>

<script>
(() => {
  const PRESETS = [[1,0],[3,0],[3,2],[5,0],[5,3],[10,0],[10,5],[15,10],[30,0]];
  const STORE = 'sjakkur-cfg';

  let cfg = { min: 5, inc: 0 };
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.min > 0 && s.inc >= 0) cfg = s;
  } catch (e) {}

  let t = [0, 0];          // gjenstående tid i ms
  let moves = [0, 0];
  let active = null;       // 0 = øverst, 1 = nederst, null = ikke startet
  let paused = false;
  let over = false;
  let last = 0;
  let raf = 0;
  let wakeLock = null;
  let audio = null;

  const $ = id => document.getElementById(id);
  const sides = [$('p0'), $('p1')];
  const settings = $('settings');

  // ---------- Tid ----------
  const pad = n => String(n).padStart(2, '0');
  function fmt(ms) {
    ms = Math.max(0, ms);
    if (ms < 20000) return (Math.floor(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }

  function update() {
    if (active === null || paused || over) return;
    const now = performance.now();
    t[active] -= now - last;
    last = now;
    if (t[active] <= 0) {
      t[active] = 0;
      over = true;
      cancelAnimationFrame(raf);
      alarm();
    }
  }

  function tick() {
    update();
    render();
    if (!over && !paused && active !== null) raf = requestAnimationFrame(tick);
  }

  function render() {
    for (let i = 0; i < 2; i++) {
      sides[i].querySelector('.time').textContent = fmt(t[i]);
      sides[i].querySelector('.moves').textContent = moves[i] ? `Trekk: ${moves[i]}` : '';
      sides[i].classList.toggle('active', active === i && !over);
      sides[i].classList.toggle('flag', over && t[i] === 0);
    }
    $('pauseBtn').textContent = paused ? '▶' : '⏸';
  }

  // ---------- Handlinger ----------
  function press(i) {
    if (over || paused || !settings.classList.contains('hidden')) return;
    unlockAudio();

    if (active === null) {           // første trykk: start motstanderens klokke
      active = 1 - i;
      last = performance.now();
      keepAwake();
      buzz();
      tick();
      return;
    }
    if (active !== i) return;        // ikke din tur

    update();
    if (over) { render(); return; }
    t[i] += cfg.inc * 1000;
    moves[i]++;
    active = 1 - i;
    buzz();
    render();
  }

  function togglePause() {
    if (active === null || over) return;
    if (paused) {
      paused = false;
      last = performance.now();
      tick();
    } else {
      update();
      paused = true;
      cancelAnimationFrame(raf);
      render();
    }
  }

  function reset() {
    cancelAnimationFrame(raf);
    t = [cfg.min * 60000, cfg.min * 60000];
    moves = [0, 0];
    active = null;
    paused = false;
    over = false;
    render();
  }

  // ---------- Innstillinger ----------
  function openSettings() {
    if (active !== null && !paused && !over) togglePause();
    $('minInput').value = cfg.min;
    $('incInput').value = cfg.inc;
    settings.classList.remove('hidden');
  }
  function closeSettings() { settings.classList.add('hidden'); }

  function apply(min, inc) {
    if (!(min > 0)) return;
    cfg = { min, inc: Math.max(0, inc || 0) };
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {}
    reset();
    closeSettings();
  }

  PRESETS.forEach(([m, inc]) => {
    const b = document.createElement('button');
    b.textContent = `${m}+${inc}`;
    b.addEventListener('click', () => apply(m, inc));
    $('presets').appendChild(b);
  });

  $('startBtn').addEventListener('click', () =>
    apply(parseFloat($('minInput').value), parseInt($('incInput').value, 10)));
  $('closeBtn').addEventListener('click', closeSettings);

  // ---------- Lyd, vibrasjon, skjerm ----------
  function unlockAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function beep(freq, dur, delay = 0) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq;
    o.connect(g); g.connect(audio.destination);
    const s = audio.currentTime + delay;
    g.gain.setValueAtTime(0.25, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + dur);
    o.start(s); o.stop(s + dur);
  }
  function buzz() { if (navigator.vibrate) navigator.vibrate(25); }
  function alarm() {
    beep(880, .25); beep(880, .25, .35); beep(880, .5, .7);
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
  }
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && active !== null && !over) keepAwake();
  });

  // ---------- Kobling ----------
  sides.forEach((el, i) => el.addEventListener('pointerdown', e => { e.preventDefault(); press(i); }));
  $('pauseBtn').addEventListener('click', togglePause);
  $('resetBtn').addEventListener('click', () => {
    if (active === null || over || confirm('Nullstille klokka?')) reset();
  });
  $('settingsBtn').addEventListener('click', openSettings);
  document.addEventListener('contextmenu', e => e.preventDefault());

  reset();
})();
</script>
</body>
</html>
